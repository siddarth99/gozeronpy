name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25.x"

      - name: Set up Python + NumPy
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install numpy

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -race ./...

      - name: Benchmark (smoke)
        run: go test -bench=. -benchtime=1x -run='^$' ./...
